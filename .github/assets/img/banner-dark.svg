    <rect x="688" y="108" width="448" height="40" rx="6" fill="#B9875E"/>
    <text x="708" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,'Cascadia Mono',monospace" font-size="18" letter-spacing="0.4" fill="#2B2233">DELIVERY · GitOps · Jenkins</text>
    <rect x="688" y="158" width="448" height="40" rx="6" fill="#6B7A4F"/>
    <text x="708" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,'Cascadia Mono',monospace" font-size="18" letter-spacing="0.4" fill="#EAE6DB">INFRA AS CODE · Terraform · Ansible</text>
    <rect x="688" y="208" width="448" height="40" rx="6" fill="#2F5D6B"/>
