    <path d="M71 159L80 168L71 177L62 168Z" fill="#C76B6B"/><path d="M71 164.22L74.78 168L71 171.78L67.22 168Z" fill="#2B2233"/>
    <rect x="86" y="166.6" width="62" height="2.8" rx="1.4" fill="#C76B6B"
