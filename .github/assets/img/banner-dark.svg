<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300"
     viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Mohammad Abu Mattar — DevOps and Platform Engineer, Amman, Jordan</title>
  <desc id="d">Name and role beside a layered stack diagram drawn as Petra sandstone
strata: services on Kubernetes and ECS, delivery through GitOps, infrastructure as code
with Terraform and Ansible, over a multi-account AWS foundation.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B2233"/>
      <stop offset="1" stop-color="#221B29"/>
    </linearGradient>
    <pattern id="keffiyeh" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 9L9 0L18 9L9 18Z" fill="none" stroke="#EAE6DB"
            stroke-opacity="0.26" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#surface)"/>
  <rect x="0.7" y="0.7" width="1198.6" height="298.6" rx="17.3" fill="none" stroke="#C76B6B" stroke-opacity="0.22"/>

  <g id="identity">
    <text x="64" y="78" font-family="ui-monospace,SFMono-Regular,Menlo,'Cascadia Mono',monospace" font-size="17" letter-spacing="1.6"
